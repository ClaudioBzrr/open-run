name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENRUN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "OPENRUN_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openrun-release.jks"
      - name: Build signed release APK
        env:
          OPENRUN_KEYSTORE_FILE: ${{ runner.temp }}/openrun-release.jks
          OPENRUN_KEYSTORE_PASSWORD: ${{ secrets.OPENRUN_KEYSTORE_PASSWORD }}
          OPENRUN_KEY_ALIAS: ${{ secrets.OPENRUN_KEY_ALIAS }}
          OPENRUN_KEY_PASSWORD: ${{ secrets.OPENRUN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
